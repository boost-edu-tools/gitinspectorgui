name: Run Rust Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    
env:
  CARGO_TERM_COLOR: always

jobs:
  test_cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run `cli` tests
        run: cargo test -p cli --verbose

  test_gi_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run `gi_core` tests
        run: cargo test -p gi_core --verbose

  test_gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run `gui` (Rust) tests
        run: cargo test -p gui --verbose
