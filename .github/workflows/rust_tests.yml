name: Run Rust Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    
env:
  CARGO_TERM_COLOR: always

jobs:
  build: 

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run Rust tests
      run: cargo test --verbose
